
# Deploy de exemplo: PostgreSQL + migrations do Prisma + API NestJS.
#
# Uso (docker.env é criado a partir de docker.env.example):
#   docker compose --env-file docker.env up -d
# As imagens vêm do GHCR. Para gerá-las, veja o compose.build.yaml.

name: nest-prisma

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?defina POSTGRES_USER no docker.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no docker.env}"
      POSTGRES_DB: "${POSTGRES_DB:?defina POSTGRES_DB no docker.env}"
    volumes:
      - ./docker_data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ${IMAGE_PREFIX:?}/nest-prisma-migrator:${IMAGE_TAG:?}
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Opcional: popula o banco com os 10 produtos de exemplo.
  #   docker compose --env-file docker.env run --rm seed
  seed:
    image: ${IMAGE_PREFIX:?}/nest-prisma-migrator:${IMAGE_TAG:?}
    profiles: ["seed"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["npx", "prisma", "db", "seed"]
    restart: "no"

  app:
    image: ${IMAGE_PREFIX:?}/nest-prisma-app:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      PORT: 3000
      LOG_FILE: /app/logs/app.log
    ports:
      - "${APP_PORT}:3000"
    volumes:
      - ./docker_data/logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
